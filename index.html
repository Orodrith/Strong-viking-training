<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strong Viking 2027 - Dashboard</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header & Aftelklok -->
    <header class="bg-slate-800 border border-slate-700 rounded-2xl p-6 
                   flex flex-col md:flex-row justify-between items-center gap-6">
      <div>
        <span class="text-xs font-bold uppercase text-amber-500">Doel: April 2027</span>
        <h1 class="text-2xl font-extrabold text-white mt-1">Strong Viking Dashboard</h1>
      </div>
      
      <div class="flex gap-3 text-center">
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 w-20">
          <span id="days" class="block text-2xl font-bold text-amber-500">--</span>
          <span class="text-xs text-slate-400">Dagen</span>
        </div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 w-20">
          <span id="hours" class="block text-2xl font-bold text-amber-500">--</span>
          <span class="text-xs text-slate-400">Uren</span>
        </div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 w-20">
          <span id="minutes" class="block text-2xl font-bold text-amber-500">--</span>
          <span class="text-xs text-slate-400">Min</span>
        </div>
      </div>
    </header>

    <!-- Grid voor Weekschema en Grafiek -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Vak 1: Weekschema -->
      <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-white">Weekoverzicht</h2>
          <button onclick="resetWeek()" class="text-xs text-slate-400 hover:text-amber-400">
            Reset week
          </button>
        </div>
        
        <ul class="space-y-3">
          <li class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 flex gap-3">
            <input type="checkbox" id="task-ma" onchange="saveTasks()" class="mt-1 accent-amber-500">
            <label for="task-ma" class="cursor-pointer">
              <span class="block font-semibold text-amber-400 text-sm">Ma. Sportschool</span>
              <span class="text-slate-200 text-sm">Trek, grip & benen</span>
            </label>
          </li>

          <li class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 flex gap-3">
            <input type="checkbox" id="task-di" onchange="saveTasks()" class="mt-1 accent-amber-500">
            <label for="task-di" class="cursor-pointer">
              <span class="block font-semibold text-amber-400 text-sm">Di. Hardlopen</span>
              <span class="text-slate-200 text-sm">Korte interval / opbouwen</span>
            </label>
          </li>

          <li class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 flex gap-3">
            <input type="checkbox" id="task-do" onchange="saveTasks()" class="mt-1 accent-amber-500">
            <label for="task-do" class="cursor-pointer">
              <span class="block font-semibold text-amber-400 text-sm">Do. Thuis</span>
              <span class="text-slate-200 text-sm">6kg KB en enkel/knie balans</span>
            </label>
          </li>

          <li class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 flex gap-3">
            <input type="checkbox" id="task-vr" onchange="saveTasks()" class="mt-1 accent-amber-500">
            <label for="task-vr" class="cursor-pointer">
              <span class="block font-semibold text-amber-400 text-sm">Vr. Hardlopen</span>
              <span class="text-slate-200 text-sm">Rustige duurloop (praattempo)</span>
            </label>
          </li>
        </ul>

        <div class="mt-6 pt-4 border-t border-slate-700 flex justify-between text-sm">
          <span class="text-slate-400">Voortgang:</span>
          <span id="progress-text" class="font-bold text-amber-500">0 / 4 voltooid</span>
        </div>
      </section>

      <!-- Vak 2: Hardloop Grafiek -->
      <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-white">Gelopen Kilometers</h2>
          <span id="total-km" class="text-xs font-bold text-amber-400">Totaal: 0 km</span>
        </div>

        <div class="h-48 w-full mb-4">
          <canvas id="runningChart"></canvas>
        </div>

        <div id="km-inputs" class="grid grid-cols-7 gap-1.5 text-center"></div>
      </section>

    </div>
  </div>

  <!-- Koppeling naar het JavaScript-bestand -->
  <script src="app.js"></script>
</body>
</html>
